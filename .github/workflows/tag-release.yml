name: Tag Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 4.0.4+26.1). Leave blank to use mod_version from gradle.properties."
        required: false

jobs:
  tag:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: version
        run: |
          RAW="${{ inputs.version }}"
          if [ -z "$RAW" ]; then
            RAW=$(grep '^mod_version=' gradle.properties | cut -d'=' -f2)
          fi
          TAG="${RAW//+/-}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Create and push tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "${{ steps.version.outputs.tag }}"
          git push origin "${{ steps.version.outputs.tag }}"

      - name: Trigger JitPack build
        run: |
          echo "Requesting JitPack build for ${{ steps.version.outputs.tag }}..."
          curl -s "https://jitpack.io/api/builds/com.github.MrSypz/PlateauLib/${{ steps.version.outputs.tag }}"
